name: GimmiThemLegsRelease

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: package
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            ./Build-GimmiThemLegsRelease.ps1 -Version '${{ github.ref_name }}'
          } else {
            ./Build-GimmiThemLegsRelease.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GimmiThemLegsPackage
          path: dist/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
      THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
      DOTNET_ROLL_FORWARD: LatestMajor
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GimmiThemLegsPackage
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - shell: pwsh
        run: |
          if (-not $env:TCLI_AUTH_TOKEN -or -not $env:THUNDERSTORE_NAMESPACE) {
            throw 'GimmiThemLegsPublishingAccountRequired'
          }
          dotnet tool install tcli --tool-path "$env:RUNNER_TEMP/thunderstore" --version 0.2.4
          if ($LASTEXITCODE -ne 0) { throw 'GimmiThemLegsPublisherInstallationFailed' }
          & "$env:RUNNER_TEMP/thunderstore/tcli.exe" publish --file '${{ needs.build.outputs.package }}' --package-namespace $env:THUNDERSTORE_NAMESPACE --package-name GimmiThemLegs_pre_alpha --package-version '${{ needs.build.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'GimmiThemLegsThunderstorePublishingFailed' }
          gh release create '${{ github.ref_name }}' '${{ needs.build.outputs.package }}' --title 'GimmiThemLegs [pre-alpha]' --notes '' --prerelease --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'GimmiThemLegsGitHubReleaseFailed' }

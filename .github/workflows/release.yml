name: GimmiThemLegsRelease

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            ./Build-GimmiThemLegsRelease.ps1 -Version $env:RELEASE_VERSION
          } else {
            ./Build-GimmiThemLegsRelease.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GimmiThemLegsPackage
          path: dist/*.zip
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
      THUNDERSTORE_NAMESPACE: ${{ vars.THUNDERSTORE_NAMESPACE }}
      DOTNET_ROLL_FORWARD: LatestMajor
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.ref_name }}
      RELEASE_PACKAGE: ${{ needs.build.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GimmiThemLegsPackage
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          if (-not $env:TCLI_AUTH_TOKEN -or -not $env:THUNDERSTORE_NAMESPACE) {
            throw 'GimmiThemLegsPublishingAccountRequired'
          }
          dotnet tool install tcli --tool-path "$env:RUNNER_TEMP/thunderstore" --version 0.2.4
          if ($LASTEXITCODE -ne 0) { throw 'GimmiThemLegsPublisherInstallationFailed' }
          python tools/write_publisher_configuration.py $env:RELEASE_PACKAGE --namespace $env:THUNDERSTORE_NAMESPACE --output "$env:RUNNER_TEMP/GimmiThemLegsPublisher.toml"
          if ($LASTEXITCODE -ne 0) { throw 'GimmiThemLegsPublisherConfigurationFailed' }
          python tools/verify_published_package.py $env:RELEASE_PACKAGE --namespace $env:THUNDERSTORE_NAMESPACE
          $PublicationStatus = $LASTEXITCODE
          if ($PublicationStatus -eq 3) {
            & "$env:RUNNER_TEMP/thunderstore/tcli.exe" publish --file $env:RELEASE_PACKAGE --config-path "$env:RUNNER_TEMP/GimmiThemLegsPublisher.toml"
            python tools/verify_published_package.py $env:RELEASE_PACKAGE --namespace $env:THUNDERSTORE_NAMESPACE --wait 180
            $PublicationStatus = $LASTEXITCODE
          }
          if ($PublicationStatus -ne 0) { throw 'GimmiThemLegsThunderstoreVerificationFailed' }
          ./Complete-GimmiThemLegsGitHubRelease.ps1 -ReleaseVersion $env:RELEASE_VERSION -ReleasePackage $env:RELEASE_PACKAGE
